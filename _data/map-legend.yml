- category: Cities
  items:
    - icon: /pages/dynmap_markers/anvil.png
      alt: "Icon for the city of Anvil"
      title: "The city of Anvil"
      description: "Waves lap against stone docks where traders from across Tamriel converge on the Gold Coast, sustaining a city that thrives and on sea and salt."

    - icon: /pages/dynmap_markers/bravil.png
      alt: "Icon for the city of Bravil"
      title: "The city of Bravil"
      description: "Known as the Daughter of the Niben, its streets echo with a layered history of Ayleid grandeur and Nibenese simplicity."

    - icon: /pages/dynmap_markers/cheydinhal.png
      alt: "Icon for the city of Cheydinhal"
      title: "The city of Cheydinhal"
      description: "A prosperous Nibenese city, distinguished by its Dunmeri-inspired architecture and strong cultural ties to Morrowind."

    - icon: /pages/dynmap_markers/dawnstar.png
      alt: "Icon for the city of Dawnstar"
      title: "The city of Dawnstar"
      description: "We bid you welcome to the City-State which greets the sun as it begins its journey, ..."

    - icon: /pages/dynmap_markers/imperial.png
      alt: "Icon for the The Imperial City (and other Imperial sites)"
      title: "The Imperial City (and other Imperial sites)"
      description: "'There is but one city in the Imperial Province, but one city in Tamriel, but one city in the World; that, my brothers, is the city of the Cyrodiils.' –Refayj"

    - icon: /pages/dynmap_markers/falkreath.png
      alt: "Icon for the city of Falkreath"
      title: "The city of Falkreath"
      description: "Pine-scented winds sweep past timbered houses, carrying whispers of ancestors through its serene graveyards."

    - icon: /pages/dynmap_markers/kvatch.png
      alt: "Icon for the city of Kvatch"
      title: "The city of Kvatch"
      description: "Its rebuilt streets speak of struggle and survival, where citizens honor the past while tending to their market and temple."

    - icon: /pages/dynmap_markers/leyawiin.png
      alt: "Icon for the city of Leyawiin"
      title: "The city of Leyawiin"
      description: "Sunlight glints off the river’s surface as merchants and travelers mingle amidst the city’s unique blend of cultures."

    - icon: /pages/dynmap_markers/markarth.png
      alt: "Icon for the city of Markarth"
      title: "The city of Markarth"
      description: "Carved into the cliffs of the Reach, its stone structures echo the ancient influence of the enigmatic Dwemer."

    - icon: /pages/dynmap_markers/morthal.png
      alt: "Icon for the city of Morthal"
      title: "The city of Morthal"
      description: "Mist curls around timbered homes and silent docks, as if the marsh itself watches over the hushed settlement."

    - icon: /pages/dynmap_markers/mournholdAlmalexia.png
      alt: "Icon for the city of Mournhold/Almalexia"
      title: "The city of Mournhold/Almalexia"
      description: "The capital of Morrowind, ancient and grand, a City of Light and Magic… of Gems… of Love and Charity, where every corner holds a story."

    - icon: /pages/dynmap_markers/riften.png
      alt: "Icon for the city of Riften"
      title: "The city of Riften"
      description: "Wooden bridges arch over dark waters, connecting a city of merchants, craftsmen, and secretive guilds."

    - icon: /pages/dynmap_markers/skingrad.png
      alt: "Icon for the city of Skingrad"
      title: "The city of Skingrad"
      description: "A city of fertile lands and vineyards, famed for its wine, commerce, and the enduring presence of its noble estates."

    - icon: /pages/dynmap_markers/solitude.png
      alt: "Icon for the city of Solitude"
      title: "The city of Solitude"
      description: "From its lofty arch, the harbor glistens below, and the streets echo with both the hum of trade and the whispers of political intrigue."

    - icon: /pages/dynmap_markers/vivec.png
      alt: "Icon for Vivec City"
      title: "Vivec City"
      description: "Golden temples catch the sun across serene waters, while the city hums with the whispers of history, devotion, and intrigue."

    - icon: /pages/dynmap_markers/whiterun.png
      alt: "Icon for the city of Whiterun"
      title: "The city of Whiterun"
      description: "Rising upon a central bluff, it commands the plains below, where both travelers and traders find shelter and commerce."

    - icon: /pages/dynmap_markers/windhelm.png
      alt: "Icon for the city of Windhelm"
      title: "The city of Windhelm"
      description: "Ancient battlements rise above snow-laden avenues, echoing the footsteps of kings and generations that shaped the heart of Skyrim."

    - icon: /pages/dynmap_markers/winterhold.png
      alt: "Icon for the city of Winterhold"
      title: "The city of Winterhold"
      description: "Once Skyrim’s capital, it retains echoes of its illustrious past, though now only a shadow of former glory."

- category: Towns and Settlements
  items:
    - icon: /pages/dynmap_markers/mwTown.png
      alt: "Icon for Morrowind Towns"
      title: "Morrowind Towns"
      description: "Various towns across Morrowind, from bustling market hubs to quiet, remote hamlets, reflecting the region’s diversity."

    - icon: /pages/dynmap_markers/orcStronghold.png
      alt: "Icon for Orc Stronghold"
      title: "Orc Stronghold"
      description: "A fortified settlement where Orcs live, train, and govern their clans."

    - icon: /pages/dynmap_markers/settlement.png
      alt: "Icon for Generic Settlements"
      title: "Settlements"
      description: "Small communities unaligned with major factions, where daily life continues quietly amidst the wilds."

    - icon: /pages/dynmap_markers/telvanniTower.png
      alt: "Icon for Telvanni Towers"
      title: "Telvanni Towers"
      description: "Arcane towers rising from the Morrowind landscape, where Telvanni mages pursue knowledge, experiments, and ambition."

    - icon: /pages/dynmap_markers/town.png
      alt: "Icon for Generic town"
      title: "Towns"
      description: "Various towns where trade, tradition, and daily life intersect, often acting as hubs for surrounding settlements."

    - icon: /pages/dynmap_markers/winterholdcastle.png
      alt: "Icon for College of Winterhold"
      title: "College of Winterhold"
      description: "A renowned academy of magic, standing apart from the skepticism of Winterhold’s citizens."

    - icon: /pages/dynmap_markers/farm.png
      alt: "Icon for Farmsteads"
      title: "Farms"
      description: "Agricultural communities that feed the surrounding towns and settlements, sustaining life in the wilds."

    - icon: /pages/dynmap_markers/inn.png
      alt: "Icon for Inns & taverns"
      title: "Inns & taverns"
      description: "Hubs of conversation, trade, and refuge, where stories are shared over food and drink."

    - icon: /pages/dynmap_markers/mine.png
      alt: "Icon for Mines"
      title: "Mines"
      description: "Sites of labor and industry, where miners dig deep to uncover the wealth hidden beneath the land."

    - icon: /pages/dynmap_markers/plantation.png
      alt: "Icon for Plantations"
      title: "Plantations"
      description: "Fertile fields tended to provide food, resources, and wealth to surrounding settlements."

    - icon: /pages/dynmap_markers/shack.png
      alt: "Icon for Shacks"
      title: "Shacks"
      description: "Various small structures used as basic housing or temporary shelters."

    - icon: /pages/dynmap_markers/woodmill.png
      alt: "Icon for Wood Mills"
      title: "Wood Mills"
      description: "Various wood mills supplying timber and materials to nearby communities."


- category: Camps & Fortifications
  items:
    - icon: /pages/dynmap_markers/ashlandercamp.png
      alt: "Icon for Ashlander Camps"
      title: "Ashlander Camps"
      description: "Traditional encampments of the Ashlanders, whose clans traverse the arid lands of Morrowind."

    - icon: /pages/dynmap_markers/camp.png
      alt: "Icon for Generic Camps"
      title: "Camps"
      description: "Various minor camps scattered across the land."

    - icon: /pages/dynmap_markers/imperial.png
      alt: "Icon for Imperial Camps / Forts / Other Imperial stuff"
      title: "Imperial Camps & Forts "
      description: "Temporary Imperial Legion encampments and forts of imperial design."

    - icon: /pages/dynmap_markers/stormcloakcamp.png
      alt: "Icon for Stormcloak Camp"
      title: "Stormcloak Camp"
      description: "Rebel outposts where the Stormcloaks organize and rally their forces against Imperial control."

    - icon: /pages/dynmap_markers/fort.png
      alt: "Icon for Generic Forts"
      title: "Forts"
      description: "Fortified structures not tied to any major faction."


