    - icon: /pages/dynmap_markers/mwTomb.png
      alt: "Icon for Morrowind Tombs"
      title: "Morrowind Tombs"
      description: "Velothi and Chimer tombs, sacred to their ancestors."

    - icon: /pages/dynmap_markers/sewer.png
      alt: "Icon for Sewers"
      title: "Sewers"
      description: "Underground water channels and passageways beneath settlements."

    - icon: /pages/dynmap_markers/tomb.png
      alt: "Icon for Generic Tombs"
      title: "Tombs"
