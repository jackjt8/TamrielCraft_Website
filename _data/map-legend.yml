    - icon: /pages/dynmap_markers/daedricruin.png
      alt: "Icon for Daedric Ruins"
      title: "Daedric Ruins"
      description: "Grand, often perilous sites infused with the influence of the Daedra."

    - icon: /pages/dynmap_markers/ruin.png
      alt: "Icon for other Ruins"
      title: "Ruins"
      description: "Fragmented remains of ancient buildings, scattered and mysterious."

